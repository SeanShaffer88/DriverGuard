[workspace]
resolver = "2"
members = [
    "crates/dg-core",
    "crates/dg-win",
    "crates/dg-ui",
    "crates/driverguard",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"
repository = "https://github.com/SeanShaffer88/DriverGuard"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
